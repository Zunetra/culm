# Vue on Vite, without a meta framework.

id = "vue-vite"
category = "frontend"
requires = ["toolchain/node-pnpm", "quality/eslint"]
default = false

[[merge]]
strategy = "json-deep"
target = "{{pkg_target}}"
[merge.value]
name = "{{pkg_name}}"
private = true
type = "module"
[merge.value.scripts]
dev = "{{cd_app_dir}}vite"
build = "{{cd_app_dir}}vite build"
preview = "{{cd_app_dir}}vite preview"
typecheck = "{{cd_app_dir}}vue-tsc -p tsconfig.test.json"
test = "{{cd_app_dir}}vitest run"

[[merge]]
strategy = "line-block"
target = ".gitignore"
lines = ["{{app_dir}}/dist/", "vite.config.ts.timestamp-*"]

[[install]]
manager = "pnpm"
dev = false
packages = ["vue"]

# @types/node is what typecheck actually needs: vitest.config.ts imports
# node:url and sits inside {{app_dir}}, so vue-tsc type-checks it along with
# everything else.
[[install]]
manager = "pnpm"
dev = true
packages = [
  "vite",
  "@vitejs/plugin-vue",
  "vue-tsc",
  "typescript@<6",
  "vitest",
  "@vue/test-utils",
  "jsdom",
  "@types/node",
]

[[files]]
from = "files/vite.config.ts"
to = "{{app_dir}}/vite.config.ts"

[[files]]
from = "files/index.html"
to = "{{app_dir}}/index.html"

[[files]]
from = "files/main.ts"
to = "{{app_dir}}/main.ts"

# The error boundary is in the root component rather than a separate one,
# because onErrorCaptured only sees what is below it.
[[files]]
from = "files/App.vue"
to = "{{app_dir}}/App.vue"

# The environment is read in one module so a component cannot reach for a
# variable nothing documents.
[[files]]
from = "files/config.ts"
to = "{{app_dir}}/config.ts"

[[files]]
from = "files/tsconfig.json"
to = "{{app_dir}}/tsconfig.json"

[[files]]
from = "files/tsconfig.test.json"
to = "{{app_dir}}/tsconfig.test.json"

# Without a shim TypeScript cannot resolve a .vue import at all, so the entry
# point and everything it reaches is untyped. A meta framework generates this
# during prepare; with no meta framework the layer ships it.
[[files]]
from = "files/env.d.ts"
to = "{{app_dir}}/env.d.ts"

[[files]]
from = "files/vitest.vue-vite.config.ts"
to = "{{app_dir}}/vitest.config.ts"

[[files]]
from = "files/App.spec.ts"
to = "{{app_dir}}/test/App.spec.ts"

# ESLint's default match covers .js, .mjs and .cjs only, so this layer's sources
# would be silently unlinted. The root config finds this file by its name rather
# than by importing it, so neither layer names the other.
[[files]]
from = "files/eslint.config.mjs"
to = "eslint.vue-vite.config.mjs"

# The parsers and rules ESLint needs for this layer's file types. Declared here
# rather than by the eslint layer, which has no way to know what languages a
# workspace ended up holding.
[[install]]
manager = "pnpm"
dev = true
root = true
packages = ["typescript-eslint", "eslint-plugin-vue"]
