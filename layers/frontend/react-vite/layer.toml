# React on Vite, without a meta framework.

id = "react-vite"
category = "frontend"
requires = ["toolchain/node-pnpm", "quality/eslint"]
default = false


[[merge]]
strategy = "json-deep"
target = "{{pkg_target}}"
[merge.value]
name = "{{pkg_name}}"
private = true
type = "module"
[merge.value.scripts]
dev = "cd {{app_dir}} && vite"
build = "cd {{app_dir}} && vite build"
preview = "cd {{app_dir}} && vite preview"
typecheck = "cd {{app_dir}} && tsc -p tsconfig.test.json"
test = "cd {{app_dir}} && vitest run"

[[merge]]
strategy = "line-block"
target = ".gitignore"
lines = ["{{app_dir}}/dist/", "vite.config.ts.timestamp-*"]

[[install]]
manager = "pnpm"
dev = false
packages = ["react", "react-dom"]

# @types/node is what typecheck actually needs: vitest.config.ts imports
# node:url and sits inside {{app_dir}}, so tsc type-checks it along with
# everything else.
[[install]]
manager = "pnpm"
dev = true
packages = [
  "vite",
  "@vitejs/plugin-react",
  "@types/react",
  "@types/react-dom",
  "typescript@<6",
  "vitest",
  "@testing-library/react",
  "jsdom",
  "@types/node",
]

[[files]]
from = "files/vite.config.ts"
to = "{{app_dir}}/vite.config.ts"

[[files]]
from = "files/index.html"
to = "{{app_dir}}/index.html"

[[files]]
from = "files/main.tsx"
to = "{{app_dir}}/main.tsx"

[[files]]
from = "files/App.tsx"
to = "{{app_dir}}/App.tsx"

# Without a meta framework nothing catches a render error, so the boundary is
# part of what the layer ships rather than something to add later.
[[files]]
from = "files/ErrorBoundary.tsx"
to = "{{app_dir}}/ErrorBoundary.tsx"

# The environment is read in one module so a component cannot reach for a
# variable nothing documents.
[[files]]
from = "files/config.ts"
to = "{{app_dir}}/config.ts"

[[files]]
from = "files/tsconfig.json"
to = "{{app_dir}}/tsconfig.json"

[[files]]
from = "files/tsconfig.test.json"
to = "{{app_dir}}/tsconfig.test.json"

[[files]]
from = "files/vitest.react-vite.config.ts"
to = "{{app_dir}}/vitest.config.ts"

[[files]]
from = "files/App.spec.tsx"
to = "{{app_dir}}/test/App.spec.tsx"

# ESLint's default match covers .js, .mjs and .cjs only, so this layer's sources
# would be silently unlinted. The root config finds this file by its name rather
# than by importing it, so neither layer names the other.
[[files]]
from = "files/eslint.config.mjs"
to = "eslint.react-vite.config.mjs"

# The parsers and rules ESLint needs for this layer's file types. Declared here
# rather than by the eslint layer, which has no way to know what languages a
# workspace ended up holding.
[[install]]
manager = "pnpm"
dev = true
root = true
packages = ["typescript-eslint"]
