# React on Vite, without a meta framework.

id = "react-vite"
category = "frontend"
requires = ["toolchain/node-pnpm", "quality/eslint"]
default = false

[[merge]]
strategy = "json-deep"
target = "package.json"
[merge.value.scripts]
"dev:react-vite" = "vite --config vite.react-vite.config.ts"
"build:react-vite" = "vite build --config vite.react-vite.config.ts"
"preview:react-vite" = "vite preview --config vite.react-vite.config.ts"
"typecheck:react-vite" = "tsc -p src/react-vite/tsconfig.json"
"test:react-vite" = "vitest run --config vitest.react-vite.config.ts"

[[merge]]
strategy = "line-block"
target = ".gitignore"
lines = ["dist/", "vite.config.ts.timestamp-*"]

[[install]]
manager = "pnpm"
dev = false
packages = ["react", "react-dom"]

[[install]]
manager = "pnpm"
dev = true
packages = [
  "vite",
  "@vitejs/plugin-react",
  "@types/react",
  "@types/react-dom",
  "typescript",
  "vitest",
  "@testing-library/react",
  "jsdom",
]

# Every source file sits under src/react-vite, which the config names as the
# Vite root. A second Vite frontend in the same workspace gets its own directory
# and its own config file rather than fighting over vite.config.ts.
[[files]]
from = "files/vite.config.ts"
to = "vite.react-vite.config.ts"

# The Vite root is the directory holding index.html, so the entry document lives
# beside the sources rather than at the workspace root.
[[files]]
from = "files/index.html"
to = "src/react-vite/index.html"

[[files]]
from = "files/main.tsx"
to = "src/react-vite/main.tsx"

[[files]]
from = "files/App.tsx"
to = "src/react-vite/App.tsx"

# Without a meta framework nothing catches a render error, so the boundary is
# part of what the layer ships rather than something to add later.
[[files]]
from = "files/ErrorBoundary.tsx"
to = "src/react-vite/ErrorBoundary.tsx"

# The environment is read in one module so a component cannot reach for a
# variable nothing documents.
[[files]]
from = "files/config.ts"
to = "src/react-vite/config.ts"

[[files]]
from = "files/tsconfig.json"
to = "src/react-vite/tsconfig.json"

[[files]]
from = "files/vitest.react-vite.config.ts"
to = "vitest.react-vite.config.ts"

[[files]]
from = "files/App.spec.tsx"
to = "test/react-vite/App.spec.tsx"

# ESLint's default match covers .js, .mjs and .cjs only, so this layer's sources
# would be silently unlinted. The root config finds this file by its name rather
# than by importing it, so neither layer names the other.
[[files]]
from = "files/eslint.config.mjs"
to = "eslint.react-vite.config.mjs"

# The parsers and rules ESLint needs for this layer's file types. Declared here
# rather than by the eslint layer, which has no way to know what languages a
# workspace ended up holding.
[[install]]
manager = "pnpm"
dev = true
packages = ["typescript-eslint"]
