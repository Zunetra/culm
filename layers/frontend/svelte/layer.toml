# SvelteKit, which drives Svelte through Vite.

id = "svelte"
category = "frontend"
requires = ["toolchain/node-pnpm", "quality/eslint"]
default = false

[[merge]]
strategy = "json-deep"
target = "{{pkg_target}}"
[merge.value]
name = "{{pkg_name}}"
private = true
type = "module"
[merge.value.scripts]
dev = "{{cd_app_dir}}svelte-kit sync && vite dev"
build = "{{cd_app_dir}}svelte-kit sync && vite build"
preview = "{{cd_app_dir}}vite preview"
test = "{{cd_app_dir}}svelte-kit sync && vitest run"
check = "{{cd_app_dir}}svelte-kit sync && svelte-check --tsconfig ./tsconfig.json"

[[merge]]
strategy = "line-block"
target = ".gitignore"
lines = ["{{app_dir}}/.svelte-kit/", "{{app_dir}}/build/", "{{app_dir}}/dist/"]

# vitest is capped below 5 because its own vitest/config.d.ts type-imports
# from @vitest/expect and vitest/browser, neither of which vitest 5 lists as
# a dependency; svelte-check walks that d.ts and fails on both, even though
# nothing here uses browser mode.
[[install]]
manager = "pnpm"
dev = true
packages = [
  "svelte",
  "@sveltejs/kit",
  "@sveltejs/adapter-auto",
  "@sveltejs/vite-plugin-svelte",
  "svelte-check",
  "vite",
  "typescript@<6",
  "vitest@<5",
  "@testing-library/svelte",
  "jsdom",
  "@types/node",
]

[[files]]
from = "files/svelte.config.js"
to = "{{app_dir}}/svelte.config.js"

[[files]]
from = "files/vite.config.ts"
to = "{{app_dir}}/vite.config.ts"

[[files]]
from = "files/app.html"
to = "{{app_dir}}/app.html"

[[files]]
from = "files/+page.svelte"
to = "{{app_dir}}/routes/+page.svelte"

# SvelteKit renders this in place of the route that failed, so it sits beside
# the page rather than under it.
[[files]]
from = "files/+error.svelte"
to = "{{app_dir}}/routes/+error.svelte"

# Under lib rather than beside the routes, so a component reaches it by the
# $lib alias instead of a relative path that changes with nesting.
[[files]]
from = "files/config.ts"
to = "{{app_dir}}/lib/config.ts"

# Scoped to the layer's own directory rather than claiming the root
# tsconfig.json, which is a whole-workspace file this layer has no business
# owning.
[[files]]
from = "files/tsconfig.json"
to = "{{app_dir}}/tsconfig.json"

[[files]]
from = "files/vitest.svelte.config.ts"
to = "{{app_dir}}/vitest.config.ts"

[[files]]
from = "files/page.spec.ts"
to = "{{app_dir}}/test/page.spec.ts"

# Aliased in by vitest.config.ts in place of $env/dynamic/public, which only
# the bare svelte plugin's dev-server-less tests cannot reach.
[[files]]
from = "files/env-dynamic-public.stub.ts"
to = "{{app_dir}}/test/env-dynamic-public.stub.ts"

# ESLint's default match covers .js, .mjs and .cjs only, so this layer's sources
# would be silently unlinted. The root config finds this file by its name rather
# than by importing it, so neither layer names the other.
[[files]]
from = "files/eslint.config.mjs"
to = "eslint.svelte.config.mjs"

# The parsers and rules ESLint needs for this layer's file types. Declared here
# rather than by the eslint layer, which has no way to know what languages a
# workspace ended up holding.
[[install]]
manager = "pnpm"
dev = true
root = true
packages = ["typescript-eslint", "eslint-plugin-svelte"]
