# Nuxt, the Vue meta framework.

id = "nuxt"
category = "frontend"
requires = ["toolchain/node-pnpm", "quality/eslint"]
default = false

# `nuxt prepare` is deliberately not contributed as `postinstall`. That key has
# to keep its literal name to work, so it cannot be namespaced, and a second
# framework needing its own postinstall step would collide on it.
[[merge]]
strategy = "json-deep"
target = "{{pkg_target}}"
[merge.value]
name = "{{pkg_name}}"
private = true
type = "module"
[merge.value.scripts]
dev = "cd {{app_dir}} && nuxt dev"
build = "cd {{app_dir}} && nuxt build"
preview = "cd {{app_dir}} && nuxt preview"
generate = "cd {{app_dir}} && nuxt generate"
typecheck = "cd {{app_dir}} && nuxt prepare && vue-tsc -p tsconfig.json --noEmit"
test = "cd {{app_dir}} && nuxt prepare && vitest run"

[[merge]]
strategy = "line-block"
target = ".gitignore"
lines = ["{{app_dir}}/.nuxt/", "{{app_dir}}/.output/", "{{app_dir}}/.data/", "{{app_dir}}/dist/"]

[[files]]
from = "files/nuxt.config.ts"
to = "{{app_dir}}/nuxt.config.ts"

[[files]]
from = "files/app.vue"
to = "{{app_dir}}/app.vue"

[[files]]
from = "files/default.vue"
to = "{{app_dir}}/layouts/default.vue"

[[files]]
from = "files/index.vue"
to = "{{app_dir}}/pages/index.vue"

# Nuxt renders this in place of the whole application, so it lives beside
# app.vue rather than under pages.
[[files]]
from = "files/error.vue"
to = "{{app_dir}}/error.vue"

# Scoped to srcDir rather than claiming the root tsconfig.json, which is a
# whole-workspace file this layer has no business owning.
[[files]]
from = "files/tsconfig.json"
to = "{{app_dir}}/tsconfig.json"

[[files]]
from = "files/vitest.nuxt.config.ts"
to = "{{app_dir}}/vitest.config.ts"

[[files]]
from = "files/index.spec.ts"
to = "{{app_dir}}/test/index.spec.ts"

[[install]]
manager = "pnpm"
dev = false
packages = ["vue", "vue-router"]

# happy-dom is what @nuxt/test-utils runs the Nuxt test environment on, so a
# component test needs it even though nothing imports it directly. vitest is
# capped below 5 because @nuxt/test-utils only declares a peer on ^4.0.2;
# vitest 5's "vitest/environments" export shape breaks the "nuxt" test
# environment @nuxt/test-utils registers. @types/node is what typecheck
# actually needs: vitest.config.ts imports node:url and sits inside srcDir,
# so vue-tsc type-checks it along with everything else.
[[install]]
manager = "pnpm"
dev = true
packages = [
  "nuxt",
  "typescript@<6",
  "vue-tsc",
  "vitest@<5",
  "@nuxt/test-utils",
  "@vue/test-utils",
  "happy-dom",
  "@types/node",
]

# ESLint's default match covers .js, .mjs and .cjs only, so this layer's sources
# would be silently unlinted. The root config finds this file by its name rather
# than by importing it, so neither layer names the other.
[[files]]
from = "files/eslint.config.mjs"
to = "eslint.nuxt.config.mjs"

# The parsers and rules ESLint needs for this layer's file types. Declared here
# rather than by the eslint layer, which has no way to know what languages a
# workspace ended up holding.
[[install]]
manager = "pnpm"
dev = true
root = true
packages = ["typescript-eslint", "eslint-plugin-vue"]
