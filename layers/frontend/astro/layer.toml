# Astro, content first, islands for the interactive parts.

id = "astro"
category = "frontend"
requires = ["toolchain/node-pnpm", "quality/eslint"]
default = false

[[merge]]
strategy = "json-deep"
target = "package.json"
[merge.value.scripts]
"dev{{script_suffix}}" = "astro dev"
"build{{script_suffix}}" = "astro build"
"preview{{script_suffix}}" = "astro preview"
"check{{script_suffix}}" = "astro check --tsconfig tsconfig{{config_suffix}}.test.json"
"test{{script_suffix}}" = "vitest run --config vitest{{config_suffix}}.config.ts"

[[merge]]
strategy = "line-block"
target = ".gitignore"
lines = ["dist/", ".astro/"]

[[install]]
manager = "pnpm"
dev = false
packages = ["astro"]

[[install]]
manager = "pnpm"
dev = true
packages = ["@astrojs/check", "typescript@<6", "vitest"]

# Everything Astro discovers by convention sits under src/astro, which
# astro.config.mjs names as srcDir. A second frontend in the same workspace gets
# its own directory rather than fighting over the root.
[[files]]
from = "files/astro.config.mjs"
to = "astro.config.mjs"

[[files]]
from = "files/Layout.astro"
to = "{{app_dir}}/layouts/Layout.astro"

[[files]]
from = "files/index.astro"
to = "{{app_dir}}/pages/index.astro"

# A page rather than an error boundary: a static build has no server left to
# catch a throw, so the unmatched route is the case worth handling.
[[files]]
from = "files/404.astro"
to = "{{app_dir}}/pages/404.astro"

# The environment is read in one module so a page cannot reach for a variable
# nothing documents.
[[files]]
from = "files/config.ts"
to = "{{app_dir}}/config.ts"

# Scoped to srcDir rather than claiming the root tsconfig.json, which is a
# whole-workspace file this layer has no business owning.
[[files]]
from = "files/tsconfig.json"
to = "{{app_dir}}/tsconfig.json"

# `astro check` reads the tsconfig it is pointed at to decide which files to
# check. Left on the app's own tsconfig.json it never sees the test directory,
# so a type error there passes silently; this one adds the test directory to
# what gets checked, and `check{{script_suffix}}` above points at it instead.
[[files]]
from = "files/tsconfig.test.json"
to = "tsconfig{{config_suffix}}.test.json"

[[files]]
from = "files/vitest.astro.config.ts"
to = "vitest{{config_suffix}}.config.ts"

[[files]]
from = "files/index.spec.ts"
to = "{{test_dir}}/index.spec.ts"

# ESLint's default match covers .js, .mjs and .cjs only, so this layer's sources
# would be silently unlinted. The root config finds this file by its name rather
# than by importing it, so neither layer names the other.
[[files]]
from = "files/eslint.config.mjs"
to = "eslint.astro.config.mjs"

# The parsers and rules ESLint needs for this layer's file types. Declared here
# rather than by the eslint layer, which has no way to know what languages a
# workspace ended up holding.
[[install]]
manager = "pnpm"
dev = true
packages = ["typescript-eslint", "eslint-plugin-astro"]
