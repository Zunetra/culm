# The Node and pnpm toolchain, implied by any JavaScript app rather than asked for.

id = "node-pnpm"
category = "toolchain"
default = false

# `private` is the one root key every JS layer can agree on, and they all agree
# on the same value, so it merges rather than conflicts. `name` is owned here
# for the same reason: the root manifest's identity is a property of the
# workspace, not of whichever framework happens to be installed in it.
#
# `type` is owned here for a different reason. Decision 21 makes every generated
# workspace ESM, and the module system is a property of the workspace rather
# than of any one app. This is the layer every JavaScript layer already
# requires, so it is the only place the key has a single owner. An app layer
# setting it would be deciding one app's module system for every app beside it.
[[merge]]
strategy = "json-deep"
target = "package.json"
[merge.value]
name = "{{project_name}}"
private = true
type = "module"

# `{{workspace_glob}}` is `src/*` in a monorepo (every namespaced app's own
# package.json lives at exactly that depth, per docs/CONTEXT.md decision 23)
# and blank otherwise, and a blank entry is one `yaml-list` drops rather than
# writes, so this file simply does not appear for a single-app or
# tooling-only workspace, where there is no second package.json for it to
# name. Owned here rather than by each app layer individually, since every JS
# app layer already requires this one and the glob is the same no matter
# which apps are actually selected.
[[merge]]
strategy = "yaml-list"
target = "pnpm-workspace.yaml"
[merge.lists]
packages = ["{{workspace_glob}}"]

[[merge]]
strategy = "line-block"
target = ".gitignore"
# Node's own artefacts only. `.env` and `*.log` are not Node-specific and live
# in the base layer, so listing them here too would emit them in two blocks.
lines = ["node_modules/", ".pnpm-store/", ".npm/"]

# CI steps for this toolchain, at order = 10 so infra/github-actions' checkout
# (order = 0) lands first when that layer is also selected. Nothing here
# requires it: yaml-steps fixes the trigger and job skeleton itself, so this
# contribution seeds a valid `.github/workflows/ci.yml` on its own if it is
# the only infra-shaped thing selected.
#
# `--if-present` covers `build`, `test`, `lint`, and `format:check`, none of
# which this layer owns or can guarantee exist. A single-app workspace has
# them unnamespaced and this genuinely runs them; a monorepo namespaces them
# per app (docs/CONTEXT.md's app layout rule), and this layer has no way to
# name a script it does not own, so a monorepo's build and test currently run
# nothing here. The same known gap infra/dockerfile already documents for the
# same reason.
[[merge]]
strategy = "yaml-steps"
target = ".github/workflows/ci.yml"
job = "build"
order = 10

[[merge.steps]]
name = "Set up Node"
uses = "actions/setup-node@v4"
[merge.steps.with]
node-version = "lts/*"

[[merge.steps]]
name = "Set up pnpm"
run = ["npm install -g pnpm"]

[[merge.steps]]
name = "Install dependencies"
run = ["pnpm install --frozen-lockfile"]

[[merge.steps]]
name = "Build (Node)"
run = ["pnpm run --if-present build"]

[[merge.steps]]
name = "Test (Node)"
run = ["pnpm run --if-present test"]

[[merge.steps]]
name = "Lint"
run = ["pnpm run --if-present lint"]

[[merge.steps]]
name = "Check formatting"
run = ["pnpm run --if-present format:check"]
