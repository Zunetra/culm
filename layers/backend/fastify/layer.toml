# Fastify, the schema first Node HTTP framework.

id = "fastify"
category = "backend"
requires = ["toolchain/node-pnpm"]
default = false

# Namespaced by layer id for the same reason the frontends are: a monorepo can
# hold several backends, and two layers writing different values to one script
# key is a hard merge error rather than a last-one-wins.
[[merge]]
strategy = "json-deep"
target = "package.json"
[merge.value.scripts]
"dev:fastify" = "node --watch src/fastify/server.js"
"start:fastify" = "node src/fastify/server.js"
"test:fastify" = "node --test test/fastify.test.js"

# ESM, per decision 21. This layer still sets no `type` key: that key is a
# whole-workspace switch, and one app's module system is not a decision this
# layer gets to make for every other app beside it.
[[files]]
from = "files/server.js"
to = "src/fastify/server.js"

[[files]]
from = "files/app.js"
to = "src/fastify/app.js"

[[files]]
from = "files/config.js"
to = "src/fastify/config.js"

[[files]]
from = "files/errors.js"
to = "src/fastify/errors.js"

# Node's own test runner, so a comprehensive template costs no test dependency.
[[files]]
from = "files/health.test.js"
to = "test/fastify.test.js"

[[install]]
manager = "pnpm"
dev = false
packages = ["fastify"]
