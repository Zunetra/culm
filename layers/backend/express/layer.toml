# Express, the minimal Node HTTP framework.

id = "express"
category = "backend"
requires = ["toolchain/node-pnpm"]
default = false

# Namespaced by layer id for the same reason the frontends are: a monorepo can
# hold several backends, and two layers writing different values to one script
# key is a hard merge error rather than a last-one-wins.
[[merge]]
strategy = "json-deep"
target = "package.json"
[merge.value.scripts]
"dev:express" = "node --watch src/express/server.js"
"start:express" = "node src/express/server.js"
"test:express" = "node --test test/express.test.js"

# ESM, per decision 21. This layer still sets no `type` key: that remains a
# whole-workspace switch that one app has no business making for every app
# beside it, which is why toolchain/node-pnpm owns it instead.
[[files]]
from = "files/server.js"
to = "src/express/server.js"

[[files]]
from = "files/app.js"
to = "src/express/app.js"

[[files]]
from = "files/config.js"
to = "src/express/config.js"

[[files]]
from = "files/errors.js"
to = "src/express/errors.js"

# Node's own test runner, so a comprehensive template costs no test dependency.
[[files]]
from = "files/health.test.js"
to = "test/express.test.js"

[[install]]
manager = "pnpm"
dev = false
packages = ["express"]
