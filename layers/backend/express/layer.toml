# Express, the minimal Node HTTP framework.

id = "express"
category = "backend"
requires = ["toolchain/node-pnpm", "quality/eslint"]
default = false

# {{pkg_target}} and {{app_dir}} are the layout's own answer to how many
# application layers the selection holds, per docs/CONTEXT.md decision 23: a
# workspace holding just this one backend gets a real root package.json with
# sources under src; a workspace holding this beside another application gets
# its own real package.json alongside its own sources, since two apps sharing
# one manifest is the shape decision 23 retired. `{{cd_app_dir}}` is what makes
# the script correct in both shapes: in the single-app case the package.json
# sits at the root while the sources sit under {{app_dir}}, so it expands to a
# real `cd`; in the monorepo case pnpm already runs the script with its cwd at
# {{app_dir}} (the same directory {{pkg_target}} lives in), so a literal
# `cd {{app_dir}}` there would try to cd into a directory nested inside
# itself and fail, and this expands to nothing instead.
[[merge]]
strategy = "json-deep"
target = "{{pkg_target}}"
[merge.value]
name = "{{pkg_name}}"
private = true
type = "module"
[merge.value.scripts]
dev = "{{cd_app_dir}}node --watch server.js"
start = "{{cd_app_dir}}node server.js"
test = "{{cd_app_dir}}node --test test/express.test.js"

[[files]]
from = "files/server.js"
to = "{{app_dir}}/server.js"

[[files]]
from = "files/app.js"
to = "{{app_dir}}/app.js"

[[files]]
from = "files/config.js"
to = "{{app_dir}}/config.js"

[[files]]
from = "files/errors.js"
to = "{{app_dir}}/errors.js"

# Node's own test runner, so a comprehensive template costs no test dependency.
# Nested under {{app_dir}} rather than the separate {{test_dir}} variable, like
# every migrated frontend layer: a layer that owns a real package.json owns its
# whole directory, source and tests both.
[[files]]
from = "files/health.test.js"
to = "{{app_dir}}/test/express.test.js"

# The root config's default match already covers plain .js, but declares no
# environment, so this layer's Node globals need declaring here rather than
# left undetected. The root config finds this file by its name rather than by
# importing it, so neither layer names the other.
[[files]]
from = "files/eslint.config.mjs"
to = "eslint.express.config.mjs"

[[install]]
manager = "pnpm"
dev = false
packages = ["express"]
