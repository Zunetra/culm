# Nest, the opinionated Node application framework.

id = "nestjs"
category = "backend"
requires = ["toolchain/node-pnpm", "quality/eslint"]
default = false

# {{pkg_target}} and {{app_dir}} are the layout's own answer to how many
# application layers the selection holds, per docs/CONTEXT.md decision 23: a
# workspace holding just this one backend gets a real root package.json with
# sources under src; a workspace holding this beside another application gets
# its own real package.json alongside its own sources. `{{cd_app_dir}}` is what
# makes the script correct in both shapes: in the single-app case the
# package.json sits at the root while the sources sit under {{app_dir}}, so it
# expands to a real `cd`; in the monorepo case pnpm already runs the script
# with its cwd at {{app_dir}} (the same directory {{pkg_target}} lives in), so
# a literal `cd {{app_dir}}` there would try to cd into a directory nested
# inside itself and fail, and this expands to nothing instead.
#
# `test` sets NODE_OPTIONS rather than passing --experimental-vm-modules on
# the command line because ESM support in jest still sits behind that flag,
# and jest's own bin wrapper cannot be handed a flag ahead of its script path.
# Resolving jest through node_modules/jest/bin/jest.js as a relative path
# does not work here: in the single-app shape {{app_dir}} is a subdirectory
# of the workspace root, but node_modules is installed at the root only, so
# a path relative to {{app_dir}} never finds it. Invoking the `jest` command
# name instead lets it resolve through the PATH pnpm already sets up, which
# covers both shapes. Decision 21 makes the workspace ESM, so this is the
# cost of keeping jest as this layer's runner. If it stops being worth
# paying, switching this layer to vitest is the alternative.
[[merge]]
strategy = "json-deep"
target = "{{pkg_target}}"
[merge.value]
name = "{{pkg_name}}"
private = true
type = "module"
[merge.value.scripts]
dev = "{{cd_app_dir}}nest start --watch"
build = "{{cd_app_dir}}nest build"
start = "{{cd_app_dir}}node dist/main.js"
typecheck = "{{cd_app_dir}}tsc -p tsconfig.json --noEmit"
test = "{{cd_app_dir}}NODE_OPTIONS=--experimental-vm-modules jest --config jest.config.js"

[[merge]]
strategy = "line-block"
target = ".gitignore"
lines = ["{{app_dir}}/dist/"]

[[files]]
from = "files/main.ts"
to = "{{app_dir}}/main.ts"

[[files]]
from = "files/app.module.ts"
to = "{{app_dir}}/app.module.ts"

[[files]]
from = "files/app.controller.ts"
to = "{{app_dir}}/app.controller.ts"

[[files]]
from = "files/config.ts"
to = "{{app_dir}}/config.ts"

[[files]]
from = "files/all-exceptions.filter.ts"
to = "{{app_dir}}/all-exceptions.filter.ts"

[[files]]
from = "files/nest-cli.json"
to = "{{app_dir}}/nest-cli.json"

# Inside {{app_dir}} rather than at the workspace root, which is a
# whole-workspace file this layer has no business owning. nest-cli.json points
# the compiler here.
[[files]]
from = "files/tsconfig.json"
to = "{{app_dir}}/tsconfig.json"

# nest build reads this rather than tsconfig.json directly, so the e2e spec
# under test/ never lands in the compiled output the start script runs.
[[files]]
from = "files/tsconfig.build.json"
to = "{{app_dir}}/tsconfig.build.json"

[[files]]
from = "files/jest.config.js"
to = "{{app_dir}}/jest.config.js"

# Nested under {{app_dir}} rather than the separate {{test_dir}} variable, like
# every migrated frontend layer: a layer that owns a real package.json owns its
# whole directory, source and tests both.
[[files]]
from = "files/nestjs.e2e-spec.ts"
to = "{{app_dir}}/test/nestjs.e2e-spec.ts"

# @nestjs/platform-express is a peer of @nestjs/core, not a dependency of it,
# and NestFactory.create() dynamically imports it when no adapter is given.
# Skipping it does not leave the application free to choose later: it leaves
# the generated app unable to boot at all, since Nest has no platform-agnostic
# HTTP server. Express is the default every Nest app ships with until told
# otherwise, so it is installed here rather than left as a silent runtime crash.
[[install]]
manager = "pnpm"
dev = false
packages = ["@nestjs/core", "@nestjs/common", "@nestjs/platform-express", "express", "reflect-metadata", "rxjs"]

[[install]]
manager = "pnpm"
dev = true
packages = [
  "@nestjs/cli",
  "@nestjs/schematics",
  "@nestjs/testing",
  "typescript@<6",
  "@types/node",
  "@types/express",
  "jest",
  "@types/jest",
  "ts-jest",
  "supertest",
  "@types/supertest",
]

# ESLint's default match covers .js, .mjs and .cjs only, so this layer's sources
# would be silently unlinted. The root config finds this file by its name rather
# than by importing it, so neither layer names the other.
[[files]]
from = "files/eslint.config.mjs"
to = "eslint.nestjs.config.mjs"

# The parsers and rules ESLint needs for this layer's file types. Declared here
# rather than by the eslint layer, which has no way to know what languages a
# workspace ended up holding.
[[install]]
manager = "pnpm"
dev = true
packages = ["typescript-eslint"]
