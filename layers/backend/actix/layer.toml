# Actix Web, the actor based Rust HTTP framework.
#
# Nothing here touches package.json: a Rust only workspace has none, and
# inventing one would leave a JavaScript project behind for nobody to run.
# The crate is a workspace member under crates/actix, so the root Cargo.toml is
# a [workspace] several layers contribute members to rather than a file one
# layer owns. A single Rust app is a one member workspace, which keeps the
# layout identical whatever the shape. Dependencies stay installs, so cargo
# writes the versions.

id = "actix"
category = "backend"
requires = ["toolchain/rust-cargo"]
default = false

[[merge]]
strategy = "toml-members"
target = "Cargo.toml"
members = ["crates/actix"]

# Stored as `.template` because `cargo package` drops any directory holding
# a `Cargo.toml`, which would leave this layer out of the published crate.
[[files]]
from = "files/Cargo.toml.template"
to = "crates/actix/Cargo.toml"

[[files]]
from = "files/lib.rs"
to = "crates/actix/src/lib.rs"

[[files]]
from = "files/main.rs"
to = "crates/actix/src/main.rs"

[[files]]
from = "files/config.rs"
to = "crates/actix/src/config.rs"

[[files]]
from = "files/error.rs"
to = "crates/actix/src/error.rs"

[[files]]
from = "files/health_test.rs"
to = "crates/actix/tests/health.rs"

# actix-web carries its own test harness and runtime macros, so the integration
# test needs no dev dependency of its own.
[[install]]
manager = "cargo"
dev = false
packages = ["actix-web", "serde_json", "thiserror"]
