# Turborepo as the task runner.
# One runner among several, per decision 3: nothing here is specific to culm,
# and swapping this layer for another runner changes no other layer. The
# `turbo.json` this needs is dynamic (it names every app's own package and
# task set), so it is not a static file this layer ships; `culm new` writes
# it after scaffolding, from `src/runner/registration.rs`.

id = "turborepo"
category = "runner"
requires = ["toolchain/node-pnpm"]
default = false

[[merge]]
strategy = "line-block"
target = ".gitignore"
lines = [".turbo/"]

[[install]]
manager = "pnpm"
dev = true
root = true
packages = ["turbo"]
