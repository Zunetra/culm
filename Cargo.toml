[package]
name = "culm"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Zunetra/culm"

# An explicit `return` is a deliberate style choice here, not an oversight the
# clippy gate should keep correcting.
[lints.clippy]
needless_return = "allow"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
include_dir = "0.7.4"
petgraph = "0.7"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1.4"
ureq = { version = "3.4.1", features = ["json"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }

[dev-dependencies]
proptest = "1"
# The integration tests read shipped manifests and templates directly, which
# means parsing the same formats the crate parses. Same versions as above, so
# nothing new is resolved.
serde_json = "1"
tempfile = "3.27.0"
toml = "1.1.4"
