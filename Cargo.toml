[package]
name = "culm"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Zunetra/culm"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
include_dir = "0.7.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1.4"

[dev-dependencies]
proptest = "1"
# The integration tests read shipped manifests and templates directly, which
# means parsing the same formats the crate parses. Same versions as above, so
# nothing new is resolved.
serde_json = "1"
tempfile = "3.27.0"
toml = "1.1.4"
