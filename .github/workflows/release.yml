# Builds the five platform binaries decision 8 promises ("the Rust binary is
# the product, npm is the front door", distributed as platform-specific
# `optionalDependencies") and attaches them to a GitHub release.
#
# Distinct from ci.yml (every push, proves the crate builds and its own tests
# pass) and templates.yml (weekly, proves the shipped layers still describe
# the frameworks they name). This workflow proves neither: it only proves the
# release artefact exists for every platform decision 8 lists, with a
# SHA256SUMS file and installer.sh beside it. Publishing to npm, crates.io,
# or the Homebrew tap happens only when this is run by hand on a tag with
# the `publish` input set, one channel or all of them.

name: release

on:
  push:
    tags:
      - "v*.*.*"
  # Run by hand on a tag to publish that release to a registry. Publishing is
  # never automatic: each channel needs its own secret, and a tag push alone
  # only builds and attaches binaries.
  workflow_dispatch:
    inputs:
      publish:
        description: "Registry to publish this tag to"
        type: choice
        default: none
        options: [none, npm, crates, homebrew, all]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: culm-x86_64-unknown-linux-gnu

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: culm-aarch64-unknown-linux-gnu
            cross: true

          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: culm-x86_64-apple-darwin

          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: culm-aarch64-apple-darwin

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: culm-x86_64-pc-windows-msvc.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Only the aarch64 Linux target needs a cross linker on an x86_64
      # runner; every other target's own runner already matches its host.
      - name: Install the cross linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage the binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/culm.exe" "dist/${{ matrix.artifact }}"
          else
            cp "target/${{ matrix.target }}/release/culm" "dist/${{ matrix.artifact }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: publish
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # handbook 0004: the installer verifies every download against this
      # file before it unpacks anything.
      - name: Checksums
        run: |
          cd dist
          sha256sum culm-* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/checkout@v4
        with:
          path: source
          sparse-checkout: installer.sh
          sparse-checkout-cone-mode: false

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            source/installer.sh
          generate_release_notes: true

  # === Publishing, by hand only

  npm:
    name: publish npm
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref, 'refs/tags/') &&
      (inputs.publish == 'npm' || inputs.publish == 'all')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Platform packages first, so the launcher never points at a version
      # that is not on the registry yet.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node npm/stage.mjs "$version" dist staged
          for dir in staged/culm-*; do
            (cd "$dir" && npm publish --access public)
          done
          (cd staged/culm && npm publish --access public)

  crates:
    name: publish crates.io
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref, 'refs/tags/') &&
      (inputs.publish == 'crates' || inputs.publish == 'all')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  homebrew:
    name: publish Homebrew tap
    runs-on: ubuntu-latest
    needs: release
    if: >-
      github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref, 'refs/tags/') &&
      (inputs.publish == 'homebrew' || inputs.publish == 'all')
    steps:
      - uses: actions/checkout@v4
      # The formula is rendered from the SHA256SUMS already on the release,
      # so it can only ever name binaries that release actually has.
      - name: Render the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir .
          packaging/homebrew/render.sh "${GITHUB_REF_NAME#v}" SHA256SUMS > culm.rb
          cat culm.rb
      - uses: actions/checkout@v4
        with:
          repository: zunetra/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Push to the tap
        run: |
          mkdir -p tap/Formula
          cp culm.rb tap/Formula/culm.rb
          cd tap
          git config user.name "culm release"
          git config user.email "releases@users.noreply.github.com"
          git add Formula/culm.rb
          git commit -m "chore: culm ${GITHUB_REF_NAME}"
          git push
