# Builds the five platform binaries decision 8 promises ("the Rust binary is
# the product, npm is the front door", distributed as platform-specific
# `optionalDependencies") and attaches them to a GitHub release.
#
# Distinct from ci.yml (every push, proves the crate builds and its own tests
# pass) and templates.yml (weekly, proves the shipped layers still describe
# the frameworks they name). This workflow proves neither: it only proves the
# release artefact exists for every platform decision 8 lists. It never
# publishes to npm or crates.io itself; that is a separate, deliberately
# manual step until decision 8's distribution channels are wired up for real.

name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: culm-x86_64-unknown-linux-gnu

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: culm-aarch64-unknown-linux-gnu
            cross: true

          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: culm-x86_64-apple-darwin

          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: culm-aarch64-apple-darwin

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: culm-x86_64-pc-windows-msvc.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Only the aarch64 Linux target needs a cross linker on an x86_64
      # runner; every other target's own runner already matches its host.
      - name: Install the cross linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage the binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/culm.exe" "dist/${{ matrix.artifact }}"
          else
            cp "target/${{ matrix.target }}/release/culm" "dist/${{ matrix.artifact }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: publish
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
